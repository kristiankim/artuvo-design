<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Artuvo Design — Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" />
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root {
    --charcoal: #0F0F10;
    --blue-gray: #8FA1B3;
    --warm-gray: #D5D7DB;
    --taupe: #C8B6A2;
    --stone: #F6F3EF;
    --ink-70: rgba(15, 15, 16, 0.72);
    --ink-55: rgba(15, 15, 16, 0.55);
    --ink-40: rgba(15, 15, 16, 0.4);
    --ink-12: rgba(15, 15, 16, 0.12);
    --ink-08: rgba(15, 15, 16, 0.08);
    --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
    --sans: "Hanken Grotesk", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100vh; }
  body {
    font-family: var(--sans);
    color: var(--charcoal);
    background: #E9E6E1;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  #root { display: flex; justify-content: center; }

  /* ===== SCREEN ===== */
  .screen {
    background: var(--stone);
    color: var(--charcoal);
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    scroll-behavior: smooth;
  }
  .screen::-webkit-scrollbar { display: none; }

  /* Top status spacer (status bar overlay) */
  .status-spacer { height: 54px; }

  /* ===== TOP BAR ===== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 22px 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 26px; height: 26px; display: block; }
  .brand .wm {
    font-size: 11px;
    letter-spacing: 0.4em;
    font-weight: 500;
    text-transform: uppercase;
  }
  .menu-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid var(--ink-12);
    background: transparent;
    display: grid; place-items: center;
    cursor: pointer;
    color: var(--charcoal);
  }
  .menu-btn svg { width: 16px; height: 16px; display: block; }

  /* ===== HERO ===== */
  .hero {
    padding: 26px 22px 18px;
  }
  .eyebrow {
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-55);
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
  }
  .eyebrow::before {
    content: "";
    width: 24px; height: 1px;
    background: var(--ink-40);
    display: inline-block;
  }
  h1.studio {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 64px;
    line-height: 0.94;
    letter-spacing: -0.025em;
    margin-bottom: 22px;
  }
  h1.studio em {
    font-style: italic;
    font-weight: 300;
    color: var(--blue-gray);
  }
  .lede {
    font-family: var(--serif);
    font-weight: 300;
    font-size: 18px;
    line-height: 1.4;
    color: var(--ink-70);
    text-wrap: pretty;
  }

  /* ===== WORK STRIP ===== */
  .work {
    position: relative;
    margin-top: 28px;
    height: 360px;
    overflow: hidden;
    isolation: isolate;
  }
  .work::before,
  .work::after {
    content: "";
    position: absolute;
    left: 0; right: 0;
    height: 56px;
    z-index: 3;
    pointer-events: none;
  }
  .work::before {
    top: 0;
    background: linear-gradient(to bottom, var(--stone), rgba(246,243,239,0));
  }
  .work::after {
    bottom: 0;
    background: linear-gradient(to top, var(--stone), rgba(246,243,239,0));
  }
  .work-meta {
    position: absolute;
    top: 8px; left: 22px;
    z-index: 4;
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-55);
  }
  .work-meta .yr {
    display: block;
    margin-top: 4px;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 0.02em;
    text-transform: none;
    color: var(--ink-70);
  }

  .work-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 14px;
    height: 100%;
  }
  .col {
    overflow: hidden;
    position: relative;
  }
  .col-inner {
    display: flex;
    flex-direction: column;
    gap: 12px;
    animation-duration: 38s;
    animation-iteration-count: infinite;
    animation-timing-function: linear;
    will-change: transform;
  }
  .col-up   .col-inner { animation-name: scroll-up; }
  .col-down .col-inner { animation-name: scroll-down; }
  @keyframes scroll-up {
    from { transform: translateY(0); }
    to   { transform: translateY(-50%); }
  }
  @keyframes scroll-down {
    from { transform: translateY(-50%); }
    to   { transform: translateY(0); }
  }

  .card {
    position: relative;
    border-radius: 2px;
    overflow: hidden;
    aspect-ratio: 4 / 5;
    background: var(--warm-gray);
    flex-shrink: 0;
    color: var(--stone);
    isolation: isolate;
  }
  .card .art { position: absolute; inset: 0; }
  .card .art svg { width: 100%; height: 100%; display: block; }
  .card .label {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 10px 11px 11px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 6px;
    z-index: 2;
    background: linear-gradient(to top, rgba(15,15,16,0.55), rgba(15,15,16,0));
  }
  .card.light .label {
    color: var(--charcoal);
    background: linear-gradient(to top, rgba(246,243,239,0.85), rgba(246,243,239,0));
  }
  .card .ttl {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 11px;
    line-height: 1.05;
    letter-spacing: -0.005em;
  }
  .card .tag {
    font-size: 7px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    opacity: 0.78;
    white-space: nowrap;
  }

  /* ===== SERVICES ===== */
  .services { padding: 38px 22px 0; }
  .services-head {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-55);
    padding-bottom: 10px;
    border-bottom: 1px solid var(--ink-12);
  }
  .services-head .count { color: var(--ink-40); }
  .service { border-bottom: 1px solid var(--ink-08); }
  .service-head {
    display: grid;
    grid-template-columns: 26px 1fr 14px;
    align-items: baseline;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: inherit;
    font: inherit;
    padding: 16px 0 17px;
    cursor: pointer;
  }
  .service-head .num {
    font-size: 10px;
    color: var(--ink-40);
    letter-spacing: 0.14em;
    font-variant-numeric: tabular-nums;
  }
  .service-head .name {
    font-family: var(--serif);
    font-size: 21px;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .service-head .chev {
    width: 14px; height: 14px;
    color: var(--ink-40);
    transition: transform .35s ease, color .2s;
    justify-self: end;
  }
  .service[data-open="1"] .chev { transform: rotate(180deg); color: var(--charcoal); }
  .service[data-open="1"] .name { color: var(--charcoal); }
  .service-panel {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .35s ease;
  }
  .service[data-open="1"] .service-panel { grid-template-rows: 1fr; }
  .service-panel-inner {
    overflow: hidden;
    min-height: 0;
  }
  .service-desc {
    padding: 0 0 18px 38px;
    font-family: var(--serif);
    font-weight: 300;
    font-size: 15px;
    line-height: 1.5;
    color: var(--ink-70);
    text-wrap: pretty;
  }

  /* ===== CTA ===== */
  .cta {
    margin: 32px 22px 0;
    background: var(--charcoal);
    color: var(--stone);
    text-decoration: none;
    border-radius: 2px;
    padding: 20px 12px 20px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  .cta .copy { display: flex; flex-direction: column; gap: 5px; }
  .cta .lede2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 24px;
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .cta .lede2 em { font-style: italic; font-weight: 300; color: var(--taupe); }
  .cta .sub {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(246,243,239,0.55);
  }
  .cta .arrow {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--stone);
    color: var(--charcoal);
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .cta .arrow svg { width: 16px; height: 16px; }

  /* ===== FOOT ===== */
  .foot {
    padding: 22px 22px 56px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-55);
  }
  .foot .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .foot a { color: inherit; text-decoration: none; }
  .foot .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #58a06b;
    display: inline-block;
    margin-right: 8px;
    vertical-align: middle;
    box-shadow: 0 0 0 3px rgba(88,160,107,0.18);
  }
  .foot .rule {
    height: 1px;
    background: var(--ink-12);
  }
  .foot .lockup {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 300;
    font-size: 13px;
    letter-spacing: 0;
    text-transform: none;
    color: var(--ink-55);
  }

  /* ===== view toggle (above frame) ===== */
  .view-tag {
    position: fixed;
    top: 14px; left: 14px;
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(15,15,16,0.45);
  }
  .view-tag a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(15,15,16,0.2); padding-bottom: 1px; }
</style>
</head>
<body>
  <div class="view-tag">Artuvo · Mobile · <a href="Artuvo Home.html">View desktop →</a></div>
  <div id="root"></div>

<script src="ios-frame.jsx" type="text/babel"></script>
<script src="tweaks-panel.jsx" type="text/babel"></script>
<script type="text/babel">
const { useEffect, useState, useRef } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showTopBar": true,
  "showHeading": true,
  "showLede": true,
  "showWork": true,
  "showServices": true,
  "showService01": true,
  "showService02": true,
  "showService03": true,
  "showService04": true,
  "showCTA": true,
  "showFooter": true
}/*EDITMODE-END*/;

// ============ WORK PLACEHOLDERS (mirror desktop) ============
const works = [
  { idx:'001', title:'Meridian Studio',     tag:'Brand · Web',  art:'arch',     palette:'charcoal', light:false },
  { idx:'002', title:'Northbank',           tag:'Identity',     art:'aperture', palette:'stone',    light:true  },
  { idx:'003', title:'Halden & Co.',        tag:'Refresh',      art:'rule',     palette:'bluegray', light:false },
  { idx:'004', title:'Folio',               tag:'Launch',       art:'stack',    palette:'taupe',    light:true  },
  { idx:'005', title:'Atelier Vorne',       tag:'System',       art:'arch2',    palette:'stone',    light:true  },
  { idx:'006', title:'Quiet Hours',         tag:'Local',        art:'horizon',  palette:'charcoal', light:false },
  { idx:'007', title:'Lindgren Law',        tag:'Refresh',      art:'frame',    palette:'warmgray', light:true  },
  { idx:'008', title:'Coastline',           tag:'Launch',       art:'mono',     palette:'bluegray', light:false }
];

const palettes = {
  charcoal: { bg:'#0F0F10', fg:'#F6F3EF', accent:'#C8B6A2' },
  stone:    { bg:'#F6F3EF', fg:'#0F0F10', accent:'#C8B6A2' },
  bluegray: { bg:'#8FA1B3', fg:'#F6F3EF', accent:'#0F0F10' },
  warmgray: { bg:'#D5D7DB', fg:'#0F0F10', accent:'#0F0F10' },
  taupe:    { bg:'#C8B6A2', fg:'#0F0F10', accent:'#F6F3EF' }
};

function artSVG(kind, pal) {
  const { bg, fg, accent } = palettes[pal];
  const fgAlpha = (a) => fg + Math.round(a * 255).toString(16).padStart(2, '0');
  const svgs = {
    arch: `<svg viewBox="0 0 200 250" preserveAspectRatio="xMidYMid slice">
      <rect width="200" height="250" fill="${bg}"/>
      <path d="M40 250 L40 120 A60 60 0 0 1 160 120 L160 250 Z" fill="${accent}" opacity="0.92"/>
      <line x1="0" y1="200" x2="200" y2="200" stroke="${fgAlpha(0.18)}" stroke-width="0.5"/>
      <line x1="0" y1="220" x2="200" y2="220" stroke="${fgAlpha(0.18)}" stroke-width="0.5"/>
      <line x1="0" y1="240" x2="200" y2="240" stroke="${fgAlpha(0.18)}" stroke-width="0.5"/>
    </svg>`,
    arch2: `<svg viewBox="0 0 200 250" preserveAspectRatio="xMidYMid slice">
      <rect width="200" height="250" fill="${bg}"/>
      <path d="M0 250 L0 90 A100 100 0 0 1 200 90 L200 250 Z" fill="none" stroke="${fg}" stroke-width="0.8" opacity="0.55"/>
      <path d="M30 250 L30 110 A70 70 0 0 1 170 110 L170 250 Z" fill="none" stroke="${fg}" stroke-width="0.8" opacity="0.5"/>
      <path d="M60 250 L60 130 A40 40 0 0 1 140 130 L140 250 Z" fill="none" stroke="${fg}" stroke-width="0.8" opacity="0.45"/>
      <circle cx="100" cy="100" r="3" fill="${accent}"/>
    </svg>`,
    aperture: `<svg viewBox="0 0 200 250" preserveAspectRatio="xMidYMid slice">
      <rect width="200" height="250" fill="${bg}"/>
      <g transform="translate(100 130)">
        <circle r="58" fill="none" stroke="${fg}" stroke-width="1" opacity="0.45"/>
        <circle r="44" fill="none" stroke="${fg}" stroke-width="1" opacity="0.55"/>
        <g stroke="${fg}" stroke-width="1" opacity="0.7">
          ${Array.from({length:12}).map((_,i)=>{
            const a=(i/12)*Math.PI*2;
            return `<line x1="${Math.cos(a)*20}" y1="${Math.sin(a)*20}" x2="${Math.cos(a)*44}" y2="${Math.sin(a)*44}"/>`;
          }).join('')}
        </g>
        <circle r="6" fill="${accent}"/>
      </g>
    </svg>`,
    rule: `<svg viewBox="0 0 200 250" preserveAspectRatio="xMidYMid slice">
      <rect width="200" height="250" fill="${bg}"/>
      ${Array.from({length:22}).map((_,i)=>{
        const y=30+i*9;
        const w=30+((i*37)%140);
        const x=20+((i*53)%40);
        return `<rect x="${x}" y="${y}" width="${w}" height="1" fill="${fgAlpha(0.55)}"/>`;
      }).join('')}
    </svg>`,
    stack: `<svg viewBox="0 0 200 250" preserveAspectRatio="xMidYMid slice">
      <rect width="200" height="250" fill="${bg}"/>
      <g font-family="Newsreader, serif" fill="${fg}" text-anchor="middle">
        <text x="100" y="100" font-size="42" font-style="italic" font-weight="300" letter-spacing="-1">Studio</text>
        <text x="100" y="138" font-size="42" font-weight="400" letter-spacing="-1">No. 04</text>
        <line x1="60" y1="160" x2="140" y2="160" stroke="${fg}" stroke-width="0.7"/>
        <text x="100" y="180" font-family="Hanken Grotesk, sans-serif" font-size="8" letter-spacing="3">VOLUME ONE</text>
      </g>
    </svg>`,
    horizon: `<svg viewBox="0 0 200 250" preserveAspectRatio="xMidYMid slice">
      <rect width="200" height="250" fill="${bg}"/>
      <rect y="170" width="200" height="80" fill="${accent}" opacity="0.85"/>
      <circle cx="148" cy="80" r="22" fill="${fg}" opacity="0.85"/>
      <path d="M0 170 L50 150 L90 160 L140 140 L200 158 L200 170 Z" fill="${fgAlpha(0.25)}"/>
    </svg>`,
    frame: `<svg viewBox="0 0 200 250" preserveAspectRatio="xMidYMid slice">
      <rect width="200" height="250" fill="${bg}"/>
      <g stroke="${fgAlpha(0.6)}" stroke-width="0.8" fill="none">
        <rect x="30" y="40" width="140" height="170"/>
        <line x1="100" y1="40" x2="100" y2="210"/>
        <line x1="30" y1="125" x2="170" y2="125"/>
      </g>
      <rect x="100" y="40" width="70" height="85" fill="${accent}" opacity="0.6"/>
    </svg>`,
    mono: `<svg viewBox="0 0 200 250" preserveAspectRatio="xMidYMid slice">
      <rect width="200" height="250" fill="${bg}"/>
      <g transform="translate(100 130)">
        <circle r="62" fill="none" stroke="${fg}" stroke-width="0.8" opacity="0.4"/>
        <text text-anchor="middle" font-family="Newsreader, serif" font-size="120" font-weight="300" fill="${fg}" dominant-baseline="central" font-style="italic" opacity="0.95">C</text>
      </g>
      <text x="100" y="225" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="7" letter-spacing="4" fill="${fgAlpha(0.7)}">COASTLINE · MMXXV</text>
    </svg>`,
  };
  return svgs[kind] || svgs.arch;
}

function Card({ w }) {
  return (
    <article className={"card" + (w.light ? " light" : "")}>
      <div className="art" dangerouslySetInnerHTML={{__html: artSVG(w.art, w.palette)}} />
      <div className="label">
        <span className="ttl">{w.title}</span>
        <span className="tag">{w.tag}</span>
      </div>
    </article>
  );
}

function WorkColumn({ items, dir }) {
  const ref = useRef(null);
  useEffect(() => {
    if (dir === 'down' && ref.current) ref.current.style.animationDelay = '-19s';
  }, [dir]);
  return (
    <div className={"col col-" + dir}>
      <div className="col-inner" ref={ref}>
        {[...items, ...items].map((w, i) => <Card key={i} w={w} />)}
      </div>
    </div>
  );
}

function Service({ n, name, desc, open, onToggle }) {
  return (
    <div className="service" data-open={open ? "1" : undefined}>
      <button className="service-head" type="button" aria-expanded={open} onClick={onToggle}>
        <span className="num">{n}</span>
        <span className="name">{name}</span>
        <svg className="chev" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <polyline points="3 5 7 9 11 5" />
        </svg>
      </button>
      <div className="service-panel">
        <div className="service-panel-inner">
          <p className="service-desc">{desc}</p>
        </div>
      </div>
    </div>
  );
}

function ArtuvoMobile({ t }) {
  const [open, setOpen] = useState(null);
  const set = (i) => setOpen(open === i ? null : i);
  const colA = works.filter((_, i) => i % 2 === 0);
  const colB = works.filter((_, i) => i % 2 === 1);
  const serviceVisible = [t.showService01, t.showService02, t.showService03, t.showService04];
  const visibleCount = serviceVisible.filter(Boolean).length;

  return (
    <div className="screen">
      <div className="status-spacer" />

      {t.showTopBar && <div className="topbar">
        <div className="brand">
          <svg viewBox="0 0 60 60" fill="none" aria-hidden="true">
            <circle cx="30" cy="30" r="30" fill="#0F0F10"/>
            <g stroke="#F6F3EF" strokeWidth="1.1" strokeLinecap="round">
              <line x1="22" y1="22" x2="10" y2="32"/>
              <line x1="22" y1="22" x2="12.5" y2="38"/>
              <line x1="22" y1="22" x2="16" y2="43"/>
              <line x1="22" y1="22" x2="20" y2="46"/>
              <line x1="22" y1="22" x2="9" y2="26"/>
              <line x1="22" y1="22" x2="9" y2="20"/>
              <line x1="22" y1="22" x2="12" y2="14"/>
            </g>
            <path d="M30 14 L42 46 L37.2 46 L34.4 38.5 L25.6 38.5 L22.8 46 L18 46 L30 14 Z M30 22.4 L26.9 34.6 L33.1 34.6 L30 22.4 Z" fill="#F6F3EF"/>
          </svg>
          <span className="wm">Artuvo</span>
        </div>
        <button className="menu-btn" aria-label="Menu">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round">
            <line x1="2.5" y1="5" x2="13.5" y2="5"/>
            <line x1="2.5" y1="11" x2="13.5" y2="11"/>
          </svg>
        </button>
      </div>}

      {(t.showHeading || t.showLede) && <div className="hero">
        {t.showHeading && <h1 className="studio">Artuvo<br/><em>Design</em>.</h1>}
        {t.showLede && <p className="lede">A creative studio elevating the quality of services through considered design — clear, credible, and made to earn trust.</p>}
      </div>}

      {t.showWork && <div className="work">
        <div className="work-meta">
          Selected Work
          <span className="yr">Volume 01 · 2025</span>
        </div>
        <div className="work-grid">
          <WorkColumn items={colA} dir="up" />
          <WorkColumn items={colB} dir="down" />
        </div>
      </div>}

      {t.showServices && <div className="services">
        <div className="services-head">
          <span>What we do</span>
          <span className="count">{String(visibleCount).padStart(2,'0')} — Offers</span>
        </div>
        {t.showService01 && <Service n="01" name="Website Refresh"
          desc="For businesses with an existing site that needs clearer messaging, better structure, stronger visuals, and sharper conversion paths — a practical upgrade, not a full rebuild."
          open={open===0} onToggle={() => set(0)} />}
        {t.showService02 && <Service n="02" name="Starter Website"
          desc="A focused 3 – 5 page website for founders and local businesses. Home, about, services, proof, and contact — built to look credible from day one."
          open={open===1} onToggle={() => set(1)} />}
        {t.showService03 && <Service n="03" name="Launch Website"
          desc="The full launch: strategy, content structure, design direction, build, basic SEO, analytics setup, and a 30-day post-launch support window."
          open={open===2} onToggle={() => set(2)} />}
        {t.showService04 && <Service n="04" name="Care Plan"
          desc="Light ongoing support after launch — content edits, seasonal updates, platform checks, and a monthly look at analytics or inquiries."
          open={open===3} onToggle={() => set(3)} />}
      </div>}

      {t.showCTA && <a className="cta" href={"mailto:hello@artuvo.studio?subject=" + encodeURIComponent("Project inquiry — Artuvo") + "&body=" + encodeURIComponent("Hi Artuvo,\n\nA bit about my project:\n\n• What I'm building:\n• Timeline:\n• Budget range:\n\nThanks!\n")}>
        <span className="copy">
          <span className="lede2">Let&rsquo;s <em>talk</em>.</span>
          <span className="sub">Free 20-min intro · Reply in 24h</span>
        </span>
        <span className="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="13 6 19 12 13 18"/>
          </svg>
        </span>
      </a>}

      {t.showFooter && <div className="foot">
        <div className="row">
          <span><span className="dot"></span>Open · 1 slot, June</span>
          <a href="mailto:hello@artuvo.studio">HELLO@ARTUVO.DESIGN</a>
        </div>
        <div className="rule"></div>
        <div className="row">
          <span className="lockup">Artuvo Design</span>
          <span>© MMXXVI</span>
        </div>
      </div>}
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const resetAll = () => {
    const reset = Object.fromEntries(Object.keys(TWEAK_DEFAULTS).map(k => [k, true]));
    setTweak(reset);
  };
  return (
    <>
      <IOSDevice width={402} height={874}>
        <ArtuvoMobile t={t} />
      </IOSDevice>
      <TweaksPanel title="Tweaks — Remove elements">
        <div style={{fontSize:'11px',lineHeight:1.45,color:'rgba(41,38,27,.6)',padding:'2px 0 4px'}}>
          Toggle off any section to remove it from the layout.
        </div>
        <TweakSection label="Header">
          <TweakToggle label="Top bar (logo + menu)" value={t.showTopBar} onChange={(v)=>setTweak('showTopBar',v)} />
        </TweakSection>
        <TweakSection label="Hero">
          <TweakToggle label="Heading" value={t.showHeading} onChange={(v)=>setTweak('showHeading',v)} />
          <TweakToggle label="Lede paragraph" value={t.showLede} onChange={(v)=>setTweak('showLede',v)} />
        </TweakSection>
        <TweakSection label="Body">
          <TweakToggle label="Selected work" value={t.showWork} onChange={(v)=>setTweak('showWork',v)} />
          <TweakToggle label="Services section" value={t.showServices} onChange={(v)=>setTweak('showServices',v)} />
          <TweakToggle label="— 01 Website Refresh" value={t.showService01} onChange={(v)=>setTweak('showService01',v)} />
          <TweakToggle label="— 02 Starter Website" value={t.showService02} onChange={(v)=>setTweak('showService02',v)} />
          <TweakToggle label="— 03 Launch Website" value={t.showService03} onChange={(v)=>setTweak('showService03',v)} />
          <TweakToggle label="— 04 Care Plan" value={t.showService04} onChange={(v)=>setTweak('showService04',v)} />
        </TweakSection>
        <TweakSection label="Footer">
          <TweakToggle label="CTA card" value={t.showCTA} onChange={(v)=>setTweak('showCTA',v)} />
          <TweakToggle label="Footer" value={t.showFooter} onChange={(v)=>setTweak('showFooter',v)} />
        </TweakSection>
        <div style={{paddingTop:6}}>
          <TweakButton label="Restore all elements" secondary onClick={resetAll} />
        </div>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
